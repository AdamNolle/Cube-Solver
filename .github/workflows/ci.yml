name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  PSExecutionPolicyPreference: RemoteSigned
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (startsWith(matrix.os, 'ubuntu-') && fromJSON('["self-hosted","Linux","X64","personal-ci"]') || startsWith(matrix.os, 'windows-') && fromJSON('["self-hosted","Windows","X64","personal-ci"]') || matrix.os) || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Isolate personal Linux Rust toolchains
        if: runner.os == 'Linux' && runner.environment == 'self-hosted'
        shell: bash
        run: |
          tools="$(dirname "$RUNNER_TEMP")/_tool"
          echo "CARGO_HOME=$tools/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$tools/rustup" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_JOBS=2" >> "$GITHUB_ENV"
          echo "$tools/cargo/bin" >> "$GITHUB_PATH"
      - name: Set up personal Windows build tools
        if: runner.os == 'Windows' && runner.environment == 'self-hosted'
        shell: powershell
        run: |
          $paths = @('C:\Program Files\Git\bin', 'C:\Program Files\Git\cmd', 'C:\Program Files\PowerShell\7', 'C:\Program Files\GitHub CLI', 'C:\Program Files\7-Zip', 'C:\msys64\ucrt64\bin')
          $vswhere = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'
          if (Test-Path $vswhere) {
            $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if ($vs) { $paths += "$vs\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin"; $paths += "$vs\Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja" }
          }
          $paths | Where-Object { Test-Path $_ } | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'AGENT_TOOLSDIRECTORY=C:\personal-ci\toolcache' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'DOTNET_INSTALL_DIR=C:\personal-ci\toolcache\dotnet' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $tools = Join-Path (Split-Path $env:RUNNER_TEMP -Parent) '_tool'
          "CARGO_HOME=$tools\cargo" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RUSTUP_HOME=$tools\rustup" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$tools\cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: actions/checkout@v4

      - name: Install Node for browser runtime checks
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      # eframe/winit need these system libraries on Linux.
      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - uses: Swatinem/rust-cache@v2

      - name: Format and generated frontend check
        run: |
          cargo fmt --all -- --check
          python tools/gen-index.py --check
          python tools/frontend-smoke.py

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Test the gated reduction solver
        run: cargo test -p cube_solver --features reduction

      - name: WASM solver core compiles (wasm32)
        run: cargo build -p cube_wasm --target wasm32-unknown-unknown

      - name: Release build
        run: cargo build --release --workspace

  reduction-release-gate:
    name: reduction release replay (4x4-11x11)
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","personal-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: Isolate personal Linux Rust toolchains
        if: runner.os == 'Linux' && runner.environment == 'self-hosted'
        shell: bash
        run: |
          tools="$(dirname "$RUNNER_TEMP")/_tool"
          echo "CARGO_HOME=$tools/cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$tools/rustup" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_JOBS=2" >> "$GITHUB_ENV"
          echo "$tools/cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Replay-verified reduction corpus (4x4-8x8)
        run: >-
          cargo test --release -p cube_solver --features reduction
          reduction::finish::tests::full_solve_sizes -- --ignored --exact --nocapture
      - name: Replay-verified large reduction corpus (9x9-11x11)
        run: >-
          cargo test --release -p cube_solver --features reduction
          reduction::finish::tests::big_sizes -- --ignored --exact --nocapture
      - name: WASM integration reduction replay (4x4-5x5)
        run: >-
          cargo test --release -p cube_wasm --lib
          tests::reduction_path_solves -- --exact --nocapture
